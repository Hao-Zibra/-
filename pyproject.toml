[project]
name = "farewatch"
version = "0.1.0"
description = "Watches flight prices for a watchlist and raises an alert when a fare drops below a price line."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2,<3",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
